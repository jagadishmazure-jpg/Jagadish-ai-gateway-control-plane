[project]
name = "jagadish-ai-gateway-control-plane"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest==9.0.3", "ruff==0.7.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
src = ["src"]
lint.ignore = ["E401", "E702", "E731"]
